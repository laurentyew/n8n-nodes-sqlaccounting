name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm version that supports trusted publishing (11.5.1+)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm install --ignore-scripts --no-optional --legacy-peer-deps
        # n8n-workflow is NOT installed — types come from ./types/n8n-workflow.d.ts
        # This avoids the isolated-vm native build entirely

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Run n8n community package scanner
        run: npx @n8n/scan-community-package ./

      # Trusted publishing: npm authenticates this workflow through GitHub OIDC (id-token: write),
      # so no npm token is stored. Configure it once in the npm package settings
      # (Publish access > Trusted Publisher: laurentyew / n8n-nodes-sqlaccounting / publish.yml).
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
